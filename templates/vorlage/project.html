<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/hersch-base.html"
        },
        "features": {
            "toolbar": {
            "enabled": false
        }
        },
        "styles": [
            "transform/teipublisher.css","hersch.css"
        ],
        "script": {
            "custom": [
                "resources/scripts/language.js"
            ]
        }
    }
    ---
    [% template styles %]
    [% endtemplate %]
    [% template breadcrumbs %]
        <li>
            <a href="[[ $context-path ]]/home.html">Home</a>
        </li>
        <li>
        <pb-i18n key="menu.project">Project</pb-i18n>
    </li>
        <li class="variable-length">
            <pb-i18n key="menu.projectdescription">Project description</pb-i18n>
        </li>
    [% endtemplate %]
    <main class="project">
        <aside>
            <ul>
                <li>
                    <a class="active" href="[[ $context-path ]]/project.html">
                        <pb-i18n key="menu.projectdescription">Project description</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context-path ]]/registers.html">
                        <pb-i18n key="menu.listsandregister">listsandregister</pb-i18n>
                    </a>
                </li>
                <li>
                    <a href="[[ $context-path ]]/documentation.html">
                        <pb-i18n key="menu.documentation">Documentation</pb-i18n>
                    </a>
                </li>
            </ul>
        </aside>
        <div class="center">
            [[ landing:section($context, 'projectdescription', $project?content, 'landing.odd') ]]
        </div>
    </main>


</template>

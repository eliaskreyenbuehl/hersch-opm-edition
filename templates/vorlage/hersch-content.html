<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/hersch-base.html"
        },
        "script": {
            "custom": [
                "resources/scripts/toc.js"
            ]
        }
    }
    ---

<!-- HBS: I added the TOC to the document template instead of here
    [% template before %]
    [% if $context?features?toc?enabled and exists($context?doc)%]
    <h5>
        <pb-i18n key="document.contents">Contents</pb-i18n>
    </h5>
    <pb-load class="toc" url="api/document/{doc}/contents?lang=[[page:resolve-language($context)]]&amp;target=transcription&amp;icons=true[[ if ($context?features?toc?collapse) then '&amp;collapse=true' else '' ]]" expand="expand" src="document1" subscribe="toc" emit="toc" load-once="load-once" auto="auto">
        <pb-i18n key="dialogs.loading">Loading</pb-i18n>
    </pb-load>
    [% endif %]
    [% endtemplate %]
-->
    <main>
        [% block above-content %][% endblock %]
        <!-- Content block -->
        [% block content %][% endblock %]
        [% block below-content %][% endblock %]
    </main>
    [% if exists($context?doc) %]
    <pb-document id="document1" path="[[ $context?doc?path ]]" odd="[[ $context?doc?odd ]]" view="[[ $context?doc?view ]]" root-path="[[ $config:data-root ]]" source-view="[[ $page:EXIDE ]]"/>
    [% endif %]
</template>

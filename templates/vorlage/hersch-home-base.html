<script>
  (function () {
    var header    = document.querySelector('.site-header');
    var THRESHOLD = 300;
    var ticking   = false;

    function updateLogo() {
      if (window.scrollY &gt;= THRESHOLD) {
        header.classList.add('is-scrolled');
      } else {
        header.classList.remove('is-scrolled');
      }
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        requestAnimationFrame(updateLogo);
        ticking = true;
      }
    }, { passive: true });

    document.querySelectorAll('a[href="#"]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
      });
    });

    document.querySelectorAll('.section-aphorism a.prev, .section-aphorism a.next').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var target = document.getElementById(a.getAttribute('href').slice(1));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        }
      });
    });

    var aphBlockquotes = document.querySelectorAll('.section-aphorism blockquote');
    var aphScroller = document.querySelector('.section-aphorism .section-inner &gt; *');
    if (aphScroller &amp;&amp; aphBlockquotes.length) {
      var aphObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            aphBlockquotes.forEach(function (bq) { bq.classList.remove('active'); });
            entry.target.classList.add('active');
          }
        });
      }, { root: aphScroller, threshold: 0.6 });
      aphBlockquotes.forEach(function (bq) { aphObserver.observe(bq); });
    }
  })();
</script>

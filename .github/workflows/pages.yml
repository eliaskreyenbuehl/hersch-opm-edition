# Baut die Edition bei jedem Push auf main (oder von Hand) und stellt sie auf GitHub Pages.
# Die Actions sind auf eine Commit-Kennung festgelegt; die Version steht als Kommentar daneben.
name: Edition bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Lauf gleichzeitig; ein laufender Veröffentlichungsvorgang wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      - name: Abhängigkeiten installieren (aus uv.lock)
        run: uv sync --locked

      - name: Site bauen (ohne Abfragen bei lobid)
        run: uv run python scripts/build.py --offline
        env:
          PYTHONIOENCODING: utf-8

      - name: Links prüfen
        run: uv run python scripts/check_links.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
